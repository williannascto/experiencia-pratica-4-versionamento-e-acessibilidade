<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experiência Prática 3</title>

    <link rel="stylesheet" href="./CSS/style.css">

    <!-- Imagem moderna em WebP utilizada também como favicon -->
    <link
        rel="icon"
        type="image/webp"
        href="./Imagens/imagem-acessibilidade.webp"
    >
</head>

<body>

    <header>
        <h1>Experiência Prática 3</h1>

        <!-- Imagem otimizada em formato moderno WebP -->
        <img
            src="./Imagens/imagem-acessibilidade.webp"
            alt="Ícone representando desenvolvimento web e acessibilidade"
            class="imagem-acessibilidade"
            width="120"
            height="120"
            decoding="async"
        >

        <nav aria-label="Navegação principal">
            <a href="#/inicio">Início</a>
            <a href="#/cadastro">Cadastro</a>
            <a href="#/registros">Registros</a>
        </nav>

        <button
            type="button"
            id="alternar-contraste"
            aria-pressed="false"
        >
            Ativar alto contraste
        </button>
    </header>

    <main id="app">
        <!-- O conteúdo da SPA será carregado aqui pelo JavaScript -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./JS/main.js"></script>

</body>

</html>
